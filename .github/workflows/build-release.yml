name: build-release

# Build omnibot for all platforms on GitHub-hosted runners and publish
# the GitHub Release, npm packages, and (optionally) the Edge Add-ons
# submission when a v* tag is pushed.
#
# Runners are native per platform, so no Docker or remote build machine
# is needed:
#   - linux-x64   -> ubuntu-latest
#   - macos-arm64 -> macos-latest (Apple Silicon)
#   - windows-x64 -> windows-latest (MSVC toolchain preinstalled)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install build deps
        run: |
          pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install -e .
      - name: Nuitka standalone build
        run: |
          python -m nuitka build-config/_entry.py \
            --mode=standalone \
            --assume-yes-for-downloads \
            --jobs=2 \
            --include-package=omnibot \
            --include-data-dir=src/omnibot/sop=omnibot/sop \
            --include-data-dir=src/omnibot/skills=omnibot/skills \
            --output-dir=dist \
            --output-filename=omnibot-bin
      - name: Normalize output
        run: |
          python scripts/normalize_nuitka_standalone.py \
            --src dist/_entry.dist \
            --output-dir dist/npm-stage \
            --platform linux-x64 \
            --version ${GITHUB_REF_NAME#v} \
            --binary-name omnibot-linux-x64
      - name: Sync skills
        run: |
          cp src/omnibot/skills/omnibot/SKILL.md dist/npm-stage/omnibot-linux-x64/omnibot/skills/omnibot/SKILL.md
          cp src/omnibot/skills/omnibot/references/command-reference.md dist/npm-stage/omnibot-linux-x64/omnibot/skills/omnibot/references/command-reference.md
      - name: Package zip
        run: cd dist/npm-stage && zip -r /tmp/omnibot-linux-x64.zip omnibot-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-linux-x64
          path: /tmp/omnibot-linux-x64.zip

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: |
          pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install -e .
      - name: Nuitka standalone build
        run: |
          python -m nuitka build-config/_entry.py \
            --mode=standalone \
            --assume-yes-for-downloads \
            --jobs=0 \
            --include-package=omnibot \
            --include-data-dir=src/omnibot/sop=omnibot/sop \
            --include-data-dir=src/omnibot/skills=omnibot/skills \
            --output-dir=dist \
            --output-filename=omnibot-bin
      - name: Normalize output
        run: |
          python scripts/normalize_nuitka_standalone.py \
            --src dist/_entry.dist \
            --output-dir dist/npm-stage \
            --platform macos-arm64 \
            --version ${GITHUB_REF_NAME#v} \
            --binary-name omnibot-macos-arm64
      - name: Sync skills
        run: |
          cp src/omnibot/skills/omnibot/SKILL.md dist/npm-stage/omnibot-macos-arm64/omnibot/skills/omnibot/SKILL.md
          cp src/omnibot/skills/omnibot/references/command-reference.md dist/npm-stage/omnibot-macos-arm64/omnibot/skills/omnibot/references/command-reference.md
      - name: Package zip
        run: cd dist/npm-stage && zip -r /tmp/omnibot-macos-arm64.zip omnibot-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-macos-arm64
          path: /tmp/omnibot-macos-arm64.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build deps
        run: |
          pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install -e .
      - name: Patch Nuitka (UnicodeDecodeError on Windows)
        run: python scripts/patch_nuitka_windows.py
      - name: Nuitka standalone build
        shell: bash
        run: |
          python -m nuitka build-config/_entry.py \
            --mode=standalone \
            --assume-yes-for-downloads \
            --jobs=0 \
            --include-package=omnibot \
            --include-data-dir=src/omnibot/sop=omnibot/sop \
            --include-data-dir=src/omnibot/skills=omnibot/skills \
            --output-dir=dist \
            --output-filename=omnibot-bin
      - name: Normalize output
        shell: bash
        run: |
          python scripts/normalize_nuitka_standalone.py \
            --src dist/_entry.dist \
            --output-dir dist/npm-stage \
            --platform windows-x64 \
            --version ${GITHUB_REF_NAME#v} \
            --binary-name omnibot-windows-x64
      - name: Sync skills + VERSION
        shell: bash
        run: |
          cp src/omnibot/skills/omnibot/SKILL.md dist/npm-stage/omnibot-windows-x64/omnibot/skills/omnibot/SKILL.md
          cp src/omnibot/skills/omnibot/references/command-reference.md dist/npm-stage/omnibot-windows-x64/omnibot/skills/omnibot/references/command-reference.md
      - name: Package zip
        shell: bash
        run: cd dist/npm-stage && zip -r /tmp/omnibot-windows-x64.zip omnibot-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-windows-x64
          path: /tmp/omnibot-windows-x64.zip

  build-extension:
    name: Build Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension
        run: python build_ext.py
      - name: Package zip
        run: cd dist/omnibot && zip -r /tmp/omnibot-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: omnibot-extension
          path: /tmp/omnibot-extension.zip

  release:
    name: Publish Release + npm + Edge
    needs: [build-linux, build-macos, build-windows, build-extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            /tmp/artifacts/omnibot-linux-x64/omnibot-linux-x64.zip \
            /tmp/artifacts/omnibot-macos-arm64/omnibot-macos-arm64.zip \
            /tmp/artifacts/omnibot-windows-x64/omnibot-windows-x64.zip \
            /tmp/artifacts/omnibot-extension/omnibot-extension.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Verify versions match tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in npm-packages/cli/package.json npm-packages/linux-x64/package.json \
                   npm-packages/macos-arm64/package.json npm-packages/win-x64/package.json \
                   browser-extension/manifest.json; do
            grep -q "\"$VERSION\"" "$f" || { echo "version mismatch in $f"; exit 1; }
          done
          echo "versions OK: $VERSION"
      - name: Prepare npm packages
        run: |
          for p in linux-x64 macos-arm64 win-x64; do
            rm -rf "npm-packages/$p/bin"
            mkdir -p "npm-packages/$p/bin"
            unzip -q "/tmp/artifacts/omnibot-$p/omnibot-$p.zip" -d "npm-packages/$p/bin/"
          done
      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          for p in win-x64 linux-x64 macos-arm64; do
            (cd "npm-packages/$p" && npm publish --access public)
          done
          (cd npm-packages/cli && npm publish --access public)
      - name: Publish Edge Add-ons (if API key configured)
        if: env.EDGE_API_KEY != ''
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: |
          ./scripts/publish-edge-extension.sh /tmp/artifacts/omnibot-extension/omnibot-extension.zip
